[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-data_clean_transform"
version = "0.1.0"
description = "Data Clean Transform environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "openenv-core[core]>=0.2.2",
    "pandas>=2.0.0",
    # Environment-specific dependencies
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m data_clean_transform.server.app
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["data_clean_transform", "data_clean_transform.server"]
package-dir = { "data_clean_transform" = ".", "data_clean_transform.server" = "server" }
